<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bản đồ chú thích</title>
<style>
 

.map img {
  display: block;
  max-width: 100%;
  user-select: none;
  pointer-events: none; /* 🔥 CỰC QUAN TRỌNG */
}

.hotspot {
  width: 14px;
  height: 14px;
  background: #1e90ff;
  border-radius: 50%;
  position: absolute;
  z-index: 10;           /* 🔥 ĐÈ LÊN ẢNH */
  cursor: pointer;
}

  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .map-container {
    position: relative;
    display: inline-block;
    max-width: 1200px;
    margin: auto;
  }

  .map-container img {
    user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
    width: 100%;
    display: block;
  }

  /* hotspot */
  .hotspot {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #1e90ff;
    border-radius: 50%;
    cursor: pointer;
  }

  /* popup */
  .popup {
    position: absolute;
    background: #fff;
    border: 1px solid #ccc;
    padding: 8px 10px;
    font-size: 14px;
    display: none;
    max-width: 220px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 999;
  }
</style>
</head>
<body>
<button id="addBtn"
        style="position:fixed;
               top:10px;
               right:10px;
               z-index:9999;
               padding:6px 12px;
               font-size:14px;">
  ➕ Thêm chú thích
</button>
<button id="deleteBtn"
        style="position:fixed;top:50px;right:10px;z-index:999;">
  ❌ Xoá hotspot
</button>

<div class="map-container">
  <img src="anh.jpg" alt="Bản đồ">
</div>

 <script type="module">
import { 
  getFirestore, 
  collection, 
  getDocs, 
  addDoc,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdWO3jQrzvJya_ljuBuZvhfTFOhsjdo1o",
  authDomain: "map2-58d21.firebaseapp.com",
  projectId: "map2-58d21"
};

  

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.getDocs = getDocs;
window.collection = collection;
window.addDoc = addDoc;
</script>

<script>

  const popupTemplate = `
<b style="color:red; text-decoration: underline;">TÊN ĐƠN VỊ</b><br>
CHT: <br>
pCHT: <br>
CTVP: <br>
TLTC: <br>
TLQL: <br>
TLCT: <br>
NVCM: <br>
`;


function closeAll() {
  document.querySelectorAll('.popup').forEach(p => p.style.display = 'none');
}
</script>
const map = document.querySelector(".map-container");

<script>
 const map = document.querySelector(".map-container");
 
let adding = false;
let deleting = false;

deleteBtn.onclick = () => {
  deleting = !deleting;
  adding = false;
  deleteBtn.style.background = deleting ? "red" : "";
};
 
document.getElementById("addBtn").onclick = () => {
  adding = true;
  alert("Click vào bản đồ để thêm hotspot");
};

document.querySelector(".map-container").addEventListener("click", async e => {
  if (!adding) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const left = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + "%";
  const top  = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + "%";

  // 🔥 LƯU FIREBASE
  const docRef = await addDoc(collection(db, "hotspots"), {
  left,
  top,
  html: popupTemplate
});

const id = docRef.id;

  // 🔥 VẼ HOTSPOT NGAY
  const h = document.createElement("div");
  h.className = "hotspot";
  h.style.left = left;
  h.style.top = top;

  const pop = document.createElement("div");
  pop.className = "popup";
  pop.style.left = left;
  pop.style.top = top;
  pop.innerHTML = popupTemplate;
  pop.contentEditable = "true";
pop.addEventListener("blur", async () => {
  await updateDoc(doc(db, "hotspots", id), {
    html: pop.innerHTML
  });
});
  h.onclick = ev => {
    ev.stopPropagation();
    document.querySelectorAll(".popup").forEach(p => p.style.display = "none");
    pop.style.display = "block";
  };

  map.appendChild(h);
  map.appendChild(pop);

  adding = false;
});


async function loadFromFirebase() {
  const snap = await getDocs(collection(db, "hotspots"));
  snap.forEach(docSnap => {
    const d = docSnap.data();
    const id = docSnap.id; // ⭐ RẤT QUAN TRỌNG

    const h = document.createElement("div");
    h.className = "hotspot";
    h.style.left = d.left;
    h.style.top = d.top;

    const pop = document.createElement("div");
    pop.className = "popup";
    pop.style.left = d.left;
    pop.style.top = d.top;
    pop.innerHTML = d.html;
   

    pop.contentEditable = "true";

    // ⭐ LƯU KHI SỬA
    pop.addEventListener("blur", async () => {
      await updateDoc(doc(db, "hotspots", id), {
        html: pop.innerHTML
      });
    });

    h.onclick = async e => {
  e.stopPropagation();

  // 🔥 NẾU ĐANG CHẾ ĐỘ XOÁ
  if (deleting) {
    if (!confirm("Xoá hotspot này?")) return;
    await deleteDoc(doc(db, "hotspots", id));
    h.remove();
    pop.remove();
    return;
  }

  // bật / tắt popup
  document.querySelectorAll(".popup").forEach(p => p.style.display = "none");
  pop.style.display = "block";
};
map.appendChild(h);
map.appendChild(pop);
});
}

window.addEventListener("load", loadFromFirebase);

</script>

</body>


</html>
